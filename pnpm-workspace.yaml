allowBuilds:
  core-js: false
  esbuild: true
  sharp: true
onlyBuiltDependencies:
  - '@google/genai'
  - esbuild
  - koffi
  - protobufjs
  - sharp
# In minutes. This is aligned with the shortest Dependabot cooldown
# (semver-patch-days: 2 in .github/dependabot.yml). The cooldown only delays
# the package Dependabot bumps, while this setting applies to every lockfile
# entry, so a proposed lockfile can still fail when a transitive dependency is
# newer than this age.
minimumReleaseAge: 2880
